services:
  home-pager:
    image: your-dockerhub-user/home-pager:latest

    restart: unless-stopped

    ports:
      - "8090:8090"

    user: "${PUID:-1000}:${PGID:-1000}"

    command: ["-conf", "/etc/home-pager/home-pager.yaml"]

    volumes:
      - panel-config:/etc/home-pager
      - ./config:/config
      - ./icons:/icons
      - ./images:/images

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  panel-config:

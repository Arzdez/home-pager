widget:
  type: customapi
  url: https://unifi.example.com/proxy/network/api/s/default/stat/device/aa:bb:cc:dd:ee:ff
  method: GET
  headers:
    X-API-KEY: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
    Accept: application/json
  refreshInterval: 30000
  display: block
  mappings:
    - field: "data.0.sys_stats.loadavg_1"
      label: "Нагрузка (1 мин)"
      format: "float"
    - field: "data.0.upgradable"
      label: "Прошивка"
      format: "text"
      remap: [{"value":true,"to":"Есть обновление"},{"value":false,"to":"Актуальна"}]
    - field: "data.0.num_sta"
      label: "Клиенты"
      format: "number"

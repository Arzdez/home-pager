# Home Pager startup configuration. Homepage itself is installed separately.
listen: "127.0.0.1:8090"
config_dir: "/var/lib/home-pager/config"
password: ""

images_dir: "/var/lib/home-pager/images"
images_url: "/images"
icons_dir: "/var/lib/home-pager/icons"
icons_url: "/icons"

# Optional download proxy. Omit to inherit the service environment.
# http_proxy: "http://proxy.example.com:3128"
# https_proxy: "http://proxy.example.com:3128"
# no_proxy: "localhost,127.0.0.1"
